name: create release pr

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment to prepare
        required: true
        type: choice
        options:
          - major
          - minor
          - stage
          - patch
      dry_run:
        description: Validate and calculate only
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BUMP_TYPE: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate workflow inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BUMP_TYPE}" ]]; then
            echo "BUMP_TYPE is required."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" && ! "${GITHUB_REF_NAME}" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow can only be run on 'main' or 'release/x.y' branches."
            exit 1
          fi

      - name: Check out base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install release tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install bump-my-version towncrier

      - name: Calculate release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${GITHUB_REF_NAME}"
          current_version="$(bump-my-version show current_version)"

          new_version="$(bump-my-version show --increment "${BUMP_TYPE}" new_version)"
          sanitized_base="${base_branch//\//-}"
          sanitized_base="${sanitized_base//./-}"
          release_branch="release-pr/${sanitized_base}-${BUMP_TYPE}-v${new_version}"
          pr_title="Release: ${new_version}"

          {
            echo "current_version=${current_version}"
            echo "new_version=${new_version}"
            echo "release_branch=${release_branch}"
            echo "pr_title=${pr_title}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Release Plan"
            echo "- Base branch: ${base_branch}"
            echo "- Release type: ${BUMP_TYPE}"
            echo "- Previous version: ${current_version}"
            echo "- New version: ${new_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop after calculation
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry run requested; stopping after calculation."

      - name: Apply version and changelog updates
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          bump-my-version bump "${BUMP_TYPE}"
          towncrier build --yes --version "${{ steps.release.outputs.new_version }}"

      - name: Create release branch commit
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          release_branch="${{ steps.release.outputs.release_branch }}"
          new_version="${{ steps.release.outputs.new_version }}"

          git switch -C "${release_branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Prepare release ${new_version}" --trailer "skip-checks: true"
          git push --force-with-lease --set-upstream origin "${release_branch}"

      - name: Open release pull request
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${GITHUB_REF_NAME}"
          current_version="${{ steps.release.outputs.current_version }}"
          new_version="${{ steps.release.outputs.new_version }}"
          release_branch="${{ steps.release.outputs.release_branch }}"
          pr_title="${{ steps.release.outputs.pr_title }}"

          existing_pr_url="$({
            gh pr list \
              --base "${base_branch}" \
              --head "${release_branch}" \
              --state open \
              --json url \
              --jq '.[0].url'
          } || true)"

          if [[ -n "${existing_pr_url}" && "${existing_pr_url}" != "null" ]]; then
            echo "Existing PR found: ${existing_pr_url}"
            echo "PR_URL=${existing_pr_url}" >> "${GITHUB_ENV}"
            exit 0
          fi

          cat <<EOF > release-pr-body.md
          ## Summary

          - Base branch: \`${base_branch}\`
          - Release type: \`${BUMP_TYPE}\`
          - Previous version: \`${current_version}\`
          - New version: \`${new_version}\`
          - Changelog updated with \`towncrier\`
          EOF

          pr_url="$(gh pr create \
            --base "${base_branch}" \
            --head "${release_branch}" \
            --title "${pr_title}" \
            --body-file release-pr-body.md)"

          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"

      - name: Summarize pull request
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          if [[ -n "${PR_URL:-}" ]]; then
            echo "## Pull Request" >> "${GITHUB_STEP_SUMMARY}"
            echo "- URL: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"
          fi
