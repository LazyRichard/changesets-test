name: create release pr

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment to prepare
        required: true
        type: choice
        options:
          - major
          - minor
          - stage
          - patch
      base_branch:
        description: Optional base branch override
        required: false
        default: ""
        type: string
      dry_run:
        description: Validate and calculate only
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BUMP_TYPE: ${{ inputs.bump }}
      REQUESTED_BASE_BRANCH: ${{ inputs.base_branch }}
      RELEASE_MAINTAINERS: ${{ vars.RELEASE_MAINTAINERS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify maintainer allowlist
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_MAINTAINERS}" ]]; then
            echo "RELEASE_MAINTAINERS repository variable is not set."
            exit 1
          fi

          actor_allowed=false
          IFS=',' read -r -a maintainers <<< "${RELEASE_MAINTAINERS}"
          for maintainer in "${maintainers[@]}"; do
            normalized="${maintainer//[[:space:]]/}"
            if [[ "${normalized}" == "${GITHUB_ACTOR}" ]]; then
              actor_allowed=true
              break
            fi
          done

          if [[ "${actor_allowed}" != "true" ]]; then
            echo "${GITHUB_ACTOR} is not in RELEASE_MAINTAINERS."
            exit 1
          fi

      - name: Resolve base branch
        id: context
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${REQUESTED_BASE_BRANCH}"
          if [[ -z "${base_branch}" ]]; then
            base_branch="${GITHUB_REF_NAME}"
          fi

          echo "base_branch=${base_branch}" >> "${GITHUB_OUTPUT}"

      - name: Check out base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ steps.context.outputs.base_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install release tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install bump-my-version towncrier

      - name: Validate branch policy and calculate release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${{ steps.context.outputs.base_branch }}"
          bump_type="${BUMP_TYPE}"
          current_version="$(bump-my-version show current_version)"

          case "${base_branch}" in
            main)
              case "${bump_type}" in
                major|minor|stage) ;;
                *)
                  echo "${bump_type} is not allowed on ${base_branch}."
                  exit 1
                  ;;
              esac
              ;;
            release/*)
              if [[ ! "${base_branch}" =~ ^release/([0-9]+)\.([0-9]+)$ ]]; then
                echo "Release branches must match release/x.y."
                exit 1
              fi

              if [[ "${bump_type}" != "patch" ]]; then
                echo "Only patch releases are allowed on ${base_branch}."
                exit 1
              fi

              if [[ ! "${current_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Patch release branches require a final x.y.z version, got ${current_version}."
                exit 1
              fi

              branch_major="${BASH_REMATCH[1]}"
              branch_minor="${BASH_REMATCH[2]}"
              expected_major="${base_branch#release/}"
              expected_major="${expected_major%%.*}"
              expected_minor="${base_branch##*.}"

              if [[ "${branch_major}" != "${expected_major}" || "${branch_minor}" != "${expected_minor}" ]]; then
                echo "Current version ${current_version} does not match ${base_branch}."
                exit 1
              fi
              ;;
            *)
              echo "Release automation only supports main or release/x.y branches."
              exit 1
              ;;
          esac

          new_version="$(bump-my-version show --increment "${bump_type}" new_version)"
          sanitized_base="${base_branch//\//-}"
          sanitized_base="${sanitized_base//./-}"
          release_branch="release-pr/${sanitized_base}-${bump_type}-v${new_version}"
          pr_title="Release: ${new_version}"

          duplicate_pr_url="$({
            gh pr list \
              --base "${base_branch}" \
              --state open \
              --json headRefName,title,url \
              --jq "map(select(.headRefName == \"${release_branch}\" or .title == \"${pr_title}\"))[0].url"
          } || true)"

          if [[ -n "${duplicate_pr_url}" && "${duplicate_pr_url}" != "null" ]]; then
            echo "Open release PR already exists: ${duplicate_pr_url}"
            exit 1
          fi

          {
            echo "current_version=${current_version}"
            echo "new_version=${new_version}"
            echo "release_branch=${release_branch}"
            echo "pr_title=${pr_title}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Release Plan"
            echo "- Base branch: ${base_branch}"
            echo "- Release type: ${bump_type}"
            echo "- Previous version: ${current_version}"
            echo "- New version: ${new_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop after validation
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry run requested; stopping after validation."

      - name: Apply version and changelog updates
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          bump-my-version bump "${BUMP_TYPE}"
          towncrier build --yes --version "${{ steps.release.outputs.new_version }}"

      - name: Create release branch commit
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          release_branch="${{ steps.release.outputs.release_branch }}"
          new_version="${{ steps.release.outputs.new_version }}"

          git switch -c "${release_branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Prepare release ${new_version}"
          git push --set-upstream origin "${release_branch}"

      - name: Open release pull request
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${{ steps.context.outputs.base_branch }}"
          current_version="${{ steps.release.outputs.current_version }}"
          new_version="${{ steps.release.outputs.new_version }}"
          release_branch="${{ steps.release.outputs.release_branch }}"
          pr_title="${{ steps.release.outputs.pr_title }}"

          cat <<EOF > release-pr-body.md
          ## Summary

          - Base branch: `${base_branch}`
          - Release type: `${BUMP_TYPE}`
          - Previous version: `${current_version}`
          - New version: `${new_version}`
          - Changelog updated with `towncrier`
          EOF

          gh pr create \
            --base "${base_branch}" \
            --head "${release_branch}" \
            --title "${pr_title}" \
            --body-file release-pr-body.md
