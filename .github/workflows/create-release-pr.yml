name: create release pr

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Numeric version line to prepare
        required: true
        type: choice
        default: minor
        options:
          - none
          - major
          - minor
          - patch
      release_stage:
        description: Release stage for the target version
        required: true
        type: choice
        default: stable
        options:
          - stable
          - alpha
          - beta
          - rc
      dry_run:
        description: Validate and calculate only
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION_BUMP: ${{ inputs.version_bump }}
      RELEASE_STAGE: ${{ inputs.release_stage }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate workflow inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERSION_BUMP}" || -z "${RELEASE_STAGE}" ]]; then
            echo "VERSION_BUMP and RELEASE_STAGE are required."
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" && ! "${GITHUB_REF_NAME}" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow can only be run on 'main' or 'release/x.y' branches."
            exit 1
          fi

      - name: Check out base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install release tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install bump-my-version towncrier

      - name: Read current version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          echo "current_version=$(tr -d '[:space:]' < VERSION)" >> "${GITHUB_OUTPUT}"

      - name: Calculate next version
        id: release
        uses: ./.github/actions/calculate-next-version
        with:
          current-version: ${{ steps.current.outputs.current_version }}
          version-bump: ${{ inputs.version_bump }}
          release-stage: ${{ inputs.release_stage }}

      - name: Summarize release plan
        shell: bash
        run: |
          {
            echo "## Release Plan"
            echo "- Base branch: ${GITHUB_REF_NAME}"
            echo "- Version bump: ${VERSION_BUMP}"
            echo "- Release stage: ${RELEASE_STAGE}"
            echo "- Release mode: ${VERSION_BUMP}/${RELEASE_STAGE}"
            echo "- Previous version: ${{ steps.current.outputs.current_version }}"
            echo "- Next version: ${{ steps.release.outputs['next-version'] }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop after calculation
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Dry run requested; stopping after calculation."

      - name: Apply version and changelog updates
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          bump-my-version bump --new-version "${{ steps.release.outputs['next-version'] }}"
          towncrier build --yes --version "${{ steps.release.outputs['next-version'] }}"

      - name: Create release branch commit
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          new_version="${{ steps.release.outputs['next-version'] }}"
          sanitized_base="${GITHUB_REF_NAME//\//-}"
          sanitized_base="${sanitized_base//./-}"
          sanitized_mode="${VERSION_BUMP}-${RELEASE_STAGE}"
          release_branch="release-pr/${sanitized_base}-${sanitized_mode}-v${new_version}"

          git switch -C "${release_branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Prepare release ${new_version}" --trailer "skip-checks: true"
          git push --force-with-lease --set-upstream origin "${release_branch}"

      - name: Open release pull request
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          base_branch="${GITHUB_REF_NAME}"
          current_version="${{ steps.current.outputs.current_version }}"
          new_version="${{ steps.release.outputs['next-version'] }}"
          release_mode="${VERSION_BUMP}/${RELEASE_STAGE}"
          sanitized_base="${base_branch//\//-}"
          sanitized_base="${sanitized_base//./-}"
          sanitized_mode="${VERSION_BUMP}-${RELEASE_STAGE}"
          release_branch="release-pr/${sanitized_base}-${sanitized_mode}-v${new_version}"
          pr_title="Release: ${new_version}"

          existing_pr_url="$({
            gh pr list \
              --base "${base_branch}" \
              --head "${release_branch}" \
              --state open \
              --json url \
              --jq '.[0].url'
          } || true)"

          if [[ -n "${existing_pr_url}" && "${existing_pr_url}" != "null" ]]; then
            echo "Existing PR found: ${existing_pr_url}"
            echo "PR_URL=${existing_pr_url}" >> "${GITHUB_ENV}"
            exit 0
          fi

          cat <<EOF > release-pr-body.md
          ## Summary

          - Base branch: \`${base_branch}\`
          - Release mode: \`${release_mode}\`
          - Previous version: \`${current_version}\`
          - New version: \`${new_version}\`
          - Changelog updated with \`towncrier\`
          EOF

          pr_url="$(gh pr create \
            --base "${base_branch}" \
            --head "${release_branch}" \
            --title "${pr_title}" \
            --body-file release-pr-body.md)"

          echo "PR_URL=${pr_url}" >> "${GITHUB_ENV}"

      - name: Summarize pull request
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          if [[ -n "${PR_URL:-}" ]]; then
            echo "## Pull Request" >> "${GITHUB_STEP_SUMMARY}"
            echo "- URL: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"
          fi
