[tool.bumpversion]
current_version = "0.2.0-alpha"
parse = '''(?x)
    (?P<major>0|[1-9]\d*)\.
    (?P<minor>0|[1-9]\d*)\.
    (?P<patch>0|[1-9]\d*)
    (?:-(?P<stage>alpha|beta|rc))?
'''
serialize = [
    "{major}.{minor}.{patch}-{stage}",
    "{major}.{minor}.{patch}",
]
commit = false
tag = false

[tool.bumpversion.parts.stage]
values = ["alpha", "beta", "rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "VERSION"
